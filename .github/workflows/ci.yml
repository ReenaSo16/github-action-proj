name: Bookservice CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 1. Build and Test
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build and Test
        run: mvn -B clean verify

      - name: Verify WAR
        run: ls -lh target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookservice-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: 2. SonarQube Analysis
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: SonarQube Analysis
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || {
            echo "SONAR_HOST_URL secret is missing"
            exit 1
          }

          test -n "$SONAR_TOKEN" || {
            echo "SONAR_TOKEN secret is missing"
            exit 1
          }

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=Bookservice \
            -Dsonar.projectName=Bookservice \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  nexus:
    name: 3. Upload WAR to Nexus
    needs: sonar
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: bookservice-war
          path: dist

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Configure Nexus Credentials
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$NEXUS_USERNAME" || {
            echo "NEXUS_USERNAME secret is missing"
            exit 1
          }

          test -n "$NEXUS_PASSWORD" || {
            echo "NEXUS_PASSWORD secret is missing"
            exit 1
          }

          mkdir -p "$HOME/.m2"
          umask 077

          cat > "$HOME/.m2/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.2.0">
            <servers>
              <server>
                <id>nexus-releases</id>
                <username>${env.NEXUS_USERNAME}</username>
                <password>${env.NEXUS_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Upload WAR to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$NEXUS_URL" || {
            echo "NEXUS_URL secret is missing"
            exit 1
          }

          WAR_FILE=$(find dist -maxdepth 1 -type f -name "*.war" -print -quit)

          test -n "$WAR_FILE" || {
            echo "WAR file not found"
            exit 1
          }

          mvn -B org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
            -Durl="${NEXUS_URL%/}/repository/maven-repo/" \
            -DrepositoryId=nexus-releases \
            -Dfile="$WAR_FILE" \
            -DgroupId=com.example \
            -DartifactId=bookservice \
            -Dversion=0.0.1 \
            -Dpackaging=war \
            -DgeneratePom=true

