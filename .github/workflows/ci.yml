name: Bookservice CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # 1. Build and Test
  build:
    name: 1. Build and Test
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Build and Test
        run: mvn -B clean verify

      - name: Verify WAR
        shell: bash
        run: |
          set -euo pipefail
          ls -lh target/*.war

      - name: Upload WAR to GitHub Actions Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookservice-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 7


  # 2. SonarQube Analysis
  sonar:
    name: 2. SonarQube Analysis
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: SonarQube Analysis and Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$SONAR_HOST_URL" || {
            echo "SONAR_HOST_URL secret is missing"
            exit 1
          }

          test -n "$SONAR_TOKEN" || {
            echo "SONAR_TOKEN secret is missing"
            exit 1
          }

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=Bookservice \
            -Dsonar.projectName=Bookservice \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300


  # 3. Verify and Publish WAR Artifact
  publish-artifact:
    name: 3. Verify GitHub Artifact
    needs: sonar
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: bookservice-war
          path: dist

      - name: Verify Published WAR
        shell: bash
        run: |
          set -euo pipefail

          WAR_FILE=$(find dist -maxdepth 1 -type f -name "*.war" -print -quit)

          test -n "$WAR_FILE" || {
            echo "WAR artifact not found"
            exit 1
          }

          echo "GitHub Actions artifact is available:"
          ls -lh "$WAR_FILE"

          echo "Artifact verification successful."

