name: Bookservice CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: 1. Build and Test2
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Runner
        run: |
          whoami
          uname -a
          pwd

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build and Test Application
        run: mvn -B clean verify

      - name: Verify WAR
        run: |
          echo "Checking generated WAR files"
          ls -lh target/*.war

      - name: Upload WAR for Next Job
        uses: actions/upload-artifact@v4
        with:
          name: bookservice-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

  sonar:
    name: 2. SonarQube Analysis
    needs: build
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Cache SonarQube Packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: |
            ${{ runner.os }}-sonar

      - name: SonarQube Analysis and Quality Gate
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          test -n "$SONAR_HOST_URL" || { echo "SONAR_HOST_URL secret is missing"; exit 1; }
          test -n "$SONAR_TOKEN" || { echo "SONAR_TOKEN secret is missing"; exit 1; }

          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:5.8.0.7211:sonar \
            -Dsonar.projectKey=Bookservice \
            -Dsonar.projectName=Bookservice \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.token="$SONAR_TOKEN" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300

  publish:
    name: 3. Publish WAR Artifact
    needs: sonar
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Download WAR from Build Job
        uses: actions/download-artifact@v4
        with:
          name: bookservice-war
          path: dist

      - name: Verify Downloaded WAR
        run: |
          echo "WAR artifact passed Build and SonarQube stages"
          find dist -type f -name '*.war' -ls
          test -n "$(find dist -type f -name '*.war' -print -quit)"