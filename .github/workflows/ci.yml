
name: Bookservice CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on Azure Self-Hosted Runner
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Operating System
        run: |
          whoami
          uname -a
          pwd

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
     
      - name: Setup Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: '3.9.9'

      - name: Verify Java and Maven
        run: |
          java -version
          mvn -version

      - name: Build Application
        run: mvn clean package
      
      - name: Verify WAR Artifact
        run: |
           echo "Checking genrated WAR Files"
           ls -lh target/*.war
      
      
      - name: Upload WAR Artifactt
        uses: actions/upload-artifact@v4
        with:
          name: bookservice-war
          path: target/*.war
          if-no-files-found: error
          retention-days: 7

      
      # - name: SonarQube Analysis and Quality Gate
      #   env:
      #     SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      #     SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      #   run: |
      #     mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
      #       -Dsonar.projectKey=bookservice \
      #       -Dsonar.projectName=Bookservice \
      #       -Dsonar.host.url="$SONAR_HOST_URL" \
      #       -Dsonar.token="$SONAR_TOKEN" \
      #       -Dsonar.qualitygate.wait=true \
      #       -Dsonar.qualitygate.timeout=300
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Bookservice -Dsonar.projectName='Bookservice'
